[project]
name = "farenus-api"
version = "0.2.0"
description = "api backend for farenus-network"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michał Marcinkowski", email = "marcinkowski1901@icloud.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.157.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
